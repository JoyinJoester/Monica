name: Android CI debug

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Monica for Android/**/*.kt'
      - 'Monica for Android/**/*.java'
      - 'Monica for Android/**/*.xml'
      - 'Monica for Android/**/*.gradle'
      - 'Monica for Android/**/*.gradle.kts'
      - 'Monica for Android/**/*.kts'
      - 'Monica for Android/**/jniLibs/**/*.so'
      - 'Monica for Android/rust-jni/**'
      - 'Monica for Android/rust-lan-sync/**'
      - 'Monica for Android/rust-crypto/**'
      - 'Monica for Android/gradle/**'
      - 'Monica for Android/gradlew'
      - 'Monica for Android/gradlew.bat'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Monica for Android/**/*.kt'
      - 'Monica for Android/**/*.java'
      - 'Monica for Android/**/*.xml'
      - 'Monica for Android/**/*.gradle'
      - 'Monica for Android/**/*.gradle.kts'
      - 'Monica for Android/**/*.kts'
      - 'Monica for Android/**/jniLibs/**/*.so'
      - 'Monica for Android/rust-jni/**'
      - 'Monica for Android/rust-lan-sync/**'
      - 'Monica for Android/rust-crypto/**'
      - 'Monica for Android/gradle/**'
      - 'Monica for Android/gradlew'
      - 'Monica for Android/gradlew.bat'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: "Monica for Android"

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify bundled MDBX3 runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/verify_mdbx3_bundled_runtime.py

      - name: Run lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace --no-daemon
          lint_status=$?
          set -e

          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "::group::Full Android lint report"
            cat "$report"
            echo "::endgroup::"
          fi

          exit "$lint_status"

      - name: Build native libraries for nearby sync tests and debug APKs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo build --manifest-path rust-jni/Cargo.toml --release --locked
          (
            cd rust-jni
            cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release --locked
          )
          test -f rust-jni/target/release/libmonica_rust_jni.so
          test -f app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so
          test -f app/src/main/jniLibs/armeabi-v7a/libmonica_rust_jni.so

      - name: Verify nearby sync with real Room and host JNI
        run: ./gradlew :app:testDebugUnitTest --tests 'takagi.ru.monica.lansync.*' --stacktrace --no-daemon

      - name: Run unit tests (diagnostic)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          path: |
            Monica for Android/app/build/reports/tests/testDebugUnitTest
            Monica for Android/app/build/test-results/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List debug APK outputs
        run: find app/build/outputs/apk/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            Monica for Android/app/build/outputs/apk/debug/*.apk
            Monica for Android/app/build/outputs/apk/debug/*.APK
          retention-days: 7
          if-no-files-found: error
