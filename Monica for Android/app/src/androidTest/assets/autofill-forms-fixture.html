<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>input{display:block;box-sizing:border-box;width:95%;height:48px;margin:8px 4px;font-size:18px}</style>
<form id="login" onsubmit="return false">
  <label for="field1">Username</label><input id="field1" autocomplete="section-login username" placeholder="Username">
  <label for="field2">Password</label><input id="field2" type="password" autocomplete="section-login current-password" placeholder="Password">
</form>
<form id="newsletter" onsubmit="return false">
  <label for="field3">Newsletter email</label><input id="field3" type="email" autocomplete="section-newsletter email" placeholder="Newsletter email">
</form>
<script>
function report() {
  Fixture.reportForms(document.getElementById('field1').value,
    document.getElementById('field2').value, document.getElementById('field3').value);
}
document.addEventListener('input', report);
document.addEventListener('change', report);
report();
</script>
</html>
