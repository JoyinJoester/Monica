[package]
name = "monica-lan-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Bounded, authenticated LAN transport for native Monica vault artifacts"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
if-addrs = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = "0.5"
zeroize = "1"
